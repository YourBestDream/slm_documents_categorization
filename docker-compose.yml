services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: slm-documents-categorization:latest
    working_dir: /app
    environment:
      HF_HOME: /root/.cache/huggingface
      TRANSFORMERS_CACHE: /root/.cache/huggingface
    volumes:
      - .:/app
      - hf-cache:/root/.cache/huggingface
    stdin_open: true
    tty: true

volumes:
  hf-cache:

