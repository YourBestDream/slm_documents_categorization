[project]
name = "slm-documents-categorization"
version = "0.1.0"
description = "Fine-tune Qwen3 1.7B for document category classification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.34.0",
    "datasets>=2.20.0",
    "evaluate>=0.4.2",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "peft>=0.12.0",
    "pillow>=10.0.0",
    "pypdf>=4.2.0",
    "pytesseract>=0.3.13",
    "scikit-learn>=1.4.0",
    "torch>=2.3.0",
    "transformers>=4.51.0",
]

[project.optional-dependencies]
qlora = [
    "bitsandbytes>=0.43.0; platform_system != 'Windows'",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
